spring.application.name=fare-service
server.port=8084

# MongoDB configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/fare_db}
spring.mongodb.uri=${MONGO_URI:${MONGODB_URI:mongodb://localhost:27017/fare_db}}

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT Configuration
jwt.secret=${JWT_SECRET:w1234@asd345689}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Transparent Fare Pricing Rules
fare.base-rate=150.0
fare.per-km-rate=80.0
fare.minimum-fare=250.0

