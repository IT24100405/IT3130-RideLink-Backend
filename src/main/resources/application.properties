spring.application.name=ride-service
server.port=8083

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:${MONGODB_URI:mongodb://localhost:27017/ride_db}}
spring.mongodb.uri=${MONGO_URI:${MONGODB_URI:mongodb://localhost:27017/ride_db}}

# External service client base URLs for Feign
services.account.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
services.driver.url=${DRIVER_SERVICE_URL:http://localhost:8082}
services.fare.url=${FARE_SERVICE_URL:http://localhost:8084}

# SpringDoc Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
