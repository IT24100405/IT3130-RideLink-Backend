name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Account Service
        working-directory: account-service
        run: mvn clean test

      - name: Build and Test Driver Service
        working-directory: driver-service
        run: mvn clean test

      - name: Build and Test Ride Service
        working-directory: ride-service
        run: mvn clean test

      - name: Build and Test Fare Service
        working-directory: fare-service
        run: mvn clean test
